name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack the portfolio
        run: |
          curl --fail --location --retry 3 --output portfolio.tar.gz https://github.com/hujianfeng000-glitch/portfolio/releases/download/portfolio-assets-v1/portfolio.tar.gz
          echo "a3173da64c6edb8915c9adfebecc3c4d7365cb788d05bf5d1b88ce3043315460  portfolio.tar.gz" | sha256sum --check
          tar -xzf portfolio.tar.gz
      - name: Add lighter previews
        run: unzip -oq portfolio-mobile-preview.zip -d site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
